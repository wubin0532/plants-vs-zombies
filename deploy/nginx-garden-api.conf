# 在“植物大战僵尸”的 server 块里追加这段反代。
#
# 安全前提（重要）：
#   garden-api 的限流默认只信 TCP 来源地址（TRUST_PROXY 未设置）。
#   推荐把 garden-api 与 Nginx 放进同一个 docker 网络，并且**不把 8787 发布到宿主机**，
#   然后设置 TRUST_PROXY=1，由 Nginx 覆盖写 X-Real-IP。
#   deploy/remote-garden-setup.sh 会自动创建 garden-net 并把 Nginx 接进去。
#
# 若沿用“宿主机 IP:8787”的旧拓扑（端口对局域网开放），任何客户端都能直连并伪造
# X-Real-IP / X-Forwarded-For，因此**不要**设置 TRUST_PROXY。

location /api/ {
    # 推荐：同一 docker 网络内按容器名访问（无需发布宿主机端口）
    proxy_pass http://garden-api:8787;

    # 旧拓扑（不推荐）：代理到宿主机映射端口
    # proxy_pass http://192.168.199.5:8787;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    # 覆盖而不是追加，防止客户端伪造 XFF 前缀绕过限流
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# 若后端启用 HTTPS，可在容器上设置 COOKIE_SECURE=1。
# 纯 HTTP 局域网访问保持不设置，否则浏览器不会保存登录 Cookie。
