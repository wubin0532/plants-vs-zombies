# 在“植物大战僵尸”的 server 块（容器内 listen 8080 / 宿主机 5888）里追加。
# 你的 Nginx 在容器内，所以用宿主机局域网 IP 指向 garden-api 映射出的端口。
# 若改成共享 docker 网络，可把地址换成 http://garden-api:8787 并去掉宿主机端口映射。

location /api/ {
    proxy_pass http://192.168.199.5:8787;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# 若后端启用 HTTPS，可在 garden-api 上设置 COOKIE_SECURE=1。
# 纯 HTTP 局域网访问时保持不设置，否则浏览器不会保存登录 Cookie。
