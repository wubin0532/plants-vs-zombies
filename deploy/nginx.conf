# 将 dist 内的内容复制到 /var/www/garden 后，按实际域名修改 server_name。
server {
    listen 80;
    server_name _;
    root /var/www/garden;
    index index.html;

    include mime.types;
    default_type application/octet-stream;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 基础安全响应头。注意：任何带 add_header 的 location 都会覆盖这里的继承，
    # 所以下面设置 Cache-Control 的 location 都重复了一遍。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Vite 产物文件名带内容哈希，可长期强缓存。
    # 正则不要用 {n} 量词：nginx 会把 { 当成块开始；这里用 + 代替，并加引号。
    location ~* "^/assets/.+-[A-Za-z0-9_-]+\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # 游戏素材（cards/animation/...）文件名固定，绝不能 immutable，
    # 否则重绘后老玩家一年内仍拿到旧贴图。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # 覆盖而不是追加：$proxy_add_x_forwarded_for 会保留客户端伪造的前缀，
        # 使按首跳计数的限流可被绕过。
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS 示例（证书就绪后启用，并把 HTTP 301 跳转到 HTTPS）：
