<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.png"><title>庭院 · 美术与声音验收</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1e6;color:#284639;font:15px system-ui,sans-serif}header,main{max-width:1280px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d5d9c6}h1{font-size:27px;margin:5px 0}small{color:#718273}h2{font-size:19px;margin:24px 0 12px}button,select{font:inherit;color:inherit;border:1px solid #c4cfb6;border-radius:9px;background:#fffdf5;padding:9px 12px;cursor:pointer}button:hover,button.active{background:#dce9bd;border-color:#7d995a}#controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#stage{width:100%;aspect-ratio:1200/690;background:#d7e0c4;border-radius:16px;overflow:hidden;margin:16px 0;position:relative}#stage canvas{display:block}#caption{min-height:22px;color:#6a7a66}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:9px}.card{display:flex;flex-direction:column;gap:5px;align-items:center;font-size:12px;min-height:120px}.card img{width: 76px;height:80px;object-fit:contain}.label{font-size:12px;color:#7b866f}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#sounds{display:flex;flex-wrap:wrap;gap:8px}.asset{background:repeating-conic-gradient(#ebeadf 0% 25%,#f8f7ed 0% 50%) 0/16px 16px}footer{padding:30px;text-align:center;color:#7b866f}button:focus-visible{outline:3px solid #447c8c;outline-offset:2px}
